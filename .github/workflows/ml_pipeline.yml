name: ML Pipeline CI/CD - Seguro Antirrobos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: seguro-antirobos-api

jobs:
  lint-and-test:
    name: Lint + Tests + Data Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Linting
        run: flake8 src/ api/ tests/ --config=setup.cfg
      - name: Tests
        run: pytest tests/ -v --cov=src --cov=api --cov-report=term-missing
      - name: Validar contrato de datos
        run: python -m src.validate_data

  train-model:
    name: Train + MLflow + Quality Gate
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Preparar datos
        run: python -m src.prepare_data
      - name: Entrenar y registrar run MLflow
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          DATA_VERSION: github-${{ github.sha }}
        run: python -m src.train_pipeline --n-iter 6 --cv-splits 3
      - name: Quality gate
        run: python -m src.validate_model
      - name: Guardar artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
      - name: Guardar tracking local MLflow
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: |
            mlflow.db
            mlruns/

  build-docker:
    name: Build + Smoke Test Docker
    runs-on: ubuntu-latest
    needs: train-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
      - name: Build imagen
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest
      - name: Smoke test API
        run: |
          docker run -d --name seguro-api -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl --fail http://localhost:8000/health
          docker logs seguro-api
          docker rm -f seguro-api

      # Continuous Delivery: la imagen queda validada y lista para promoción.
      # Para Continuous Deployment real, configurar secrets y habilitar push a registry/deploy.
